name: CI

on:
  pull_request:          # every PR into main
    branches: [main]
  push:
    branches: [main]     # and every merge

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements-serve.txt pytest pymupdf python-docx openpyxl numpy

      - name: Run tests
        run: pytest -m "not integration" -v
