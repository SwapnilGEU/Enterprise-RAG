# Optional. The two `docker run` commands do the same thing.
#   docker compose up --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: rag-api
    ports:
      - "8000:8000"
    env_file: .env

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: rag-ui
    ports:
      - "8501:8501"
